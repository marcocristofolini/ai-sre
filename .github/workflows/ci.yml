# CI do AI SRE. NÃO foi executado no ambiente de desenvolvimento (sem GitHub Actions): primeira execução real
# pendente. Sem segredos; somente leitura do repositório. Ações fixadas por tag maior; versões de Node/Helm explícitas.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # reutilizado pelo release.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      # Testes de integração (Postgres) e e2e (kind) se pulam sozinhos sem as variáveis de ambiente.
      - run: python -m pytest tests -W error -q

  web:
    name: web (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build

  helm:
    name: helm lint e renderização
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: helm lint
        run: helm lint deploy/helm/aisre --set secrets.existingSecret=aisre-secrets --set postgres.auth.existingSecret=aisre-postgres
      - name: helm template (padrões e Ingress)
        run: |
          helm template aisre deploy/helm/aisre --set secrets.existingSecret=aisre-secrets --set postgres.auth.existingSecret=aisre-postgres > /dev/null
          helm template aisre deploy/helm/aisre --set secrets.existingSecret=aisre-secrets --set postgres.auth.existingSecret=aisre-postgres --set ingress.enabled=true > /dev/null
      # Com `helm` no PATH, os testes de renderização deixam de ser pulados.
      - run: python -m pytest tests/deploy -W error -q -rs
