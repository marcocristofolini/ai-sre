apiVersion: v1
kind: Namespace
metadata:
  name: eval-1
---
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: eval-1
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: python:3.12-alpine
      command: ["python", "-c", "b=[]\nwhile True: b.append(bytearray(10*1024*1024))"]
      resources:
        limits:
          memory: 32Mi
