# Remove o arquivo de enchimento quando o pod do cenário foi despejado sem rodar o preStop.
# Tolera o taint de DiskPressure para conseguir agendar no nó sob pressão.
apiVersion: v1
kind: Pod
metadata:
  name: disk-cleaner
  namespace: default
spec:
  restartPolicy: Never
  tolerations:
    - {key: node.kubernetes.io/disk-pressure, operator: Exists, effect: NoSchedule}
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "rm -f /host/aisre-fill.bin; sleep 3600"]
      volumeMounts:
        - {name: host, mountPath: /host}
  volumes:
    - name: host
      hostPath: {path: /var/lib/aisre-fill, type: DirectoryOrCreate}
