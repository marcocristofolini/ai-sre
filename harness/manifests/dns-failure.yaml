apiVersion: v1
kind: Namespace
metadata:
  name: eval-5
---
# Cliente com resolvedor inexistente: toda resolução de nomes falha.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: eval-5
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.255.255.1"]
        options:
          - {name: timeout, value: "1"}
          - {name: attempts, value: "1"}
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "while true; do nslookup kubernetes.default.svc.cluster.local || echo 'dns-error: resolucao falhou'; sleep 5; done"]
