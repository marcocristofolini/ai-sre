apiVersion: v1
kind: Namespace
metadata:
  name: eval-4
---
# Enche o disco do nó do kind via hostPath para provocar DiskPressure com um arquivo de tamanho FIXO
# (FILL_KB = 3 GiB). O limiar de despejo foi posto logo abaixo do espaço livre por
# harness/set-disk-threshold.sh, então não é preciso encher o disco do host.
# O cleanup (kubectl delete --wait) dispara o preStop que remove o arquivo; se o pod for despejado
# sem rodar o preStop, o runner aplica node-disk-pressure-cleaner.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: eval-4
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  containers:
    - name: main
      image: busybox:1.36
      env:
        - {name: FILL_KB, value: "3145728"}       # 3 GiB
        - {name: MAX_FILL_KB, value: "3145728"}   # teto: nunca escreve mais que isto
        - {name: KEEP_FREE_KB, value: "1048576"}  # nunca deixa menos de 1 GiB livre no disco
      command:
        - sh
        - -c
        - |
          set -e
          avail=$(df -Pk /host | awk 'NR==2{print $4}')
          fill=$FILL_KB
          [ "$fill" -gt "$MAX_FILL_KB" ] && fill=$MAX_FILL_KB
          if [ $((avail - fill)) -lt "$KEEP_FREE_KB" ]; then
            echo "disco quase cheio (${avail} KiB livres); não enche" >&2
          else
            dd if=/dev/zero of=/host/aisre-fill.bin bs=1k count=$fill
          fi
          sleep 3600
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "rm -f /host/aisre-fill.bin"]
      volumeMounts:
        - {name: host, mountPath: /host}
  volumes:
    - name: host
      hostPath: {path: /var/lib/aisre-fill, type: DirectoryOrCreate}
