apiVersion: v1
kind: Namespace
metadata:
  name: eval-4
---
# Enche o disco do nó do kind via hostPath para provocar DiskPressure.
# O cleanup (kubectl delete --wait) dispara o preStop que remove o arquivo.
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: eval-4
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  containers:
    - name: main
      image: busybox:1.36
      # Enche o nodefs até sobrar ~5% livre (limiar padrão do kubelet: 10%),
      # proporcional ao disco real. O arquivo é removido no preStop, no delete.
      command:
        - sh
        - -c
        - |
          set -e
          set -- $(df -Pk /host | awk 'NR==2{print $2, $4}')
          total=$1; avail=$2
          fill_kb=$((avail - total / 20))
          [ "$fill_kb" -gt 0 ] && dd if=/dev/zero of=/host/aisre-fill.bin bs=1k count=$fill_kb
          sleep 3600
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "rm -f /host/aisre-fill.bin"]
      volumeMounts:
        - {name: host, mountPath: /host}
  volumes:
    - name: host
      hostPath: {path: /var/lib/aisre-fill, type: DirectoryOrCreate}
