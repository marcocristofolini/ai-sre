apiVersion: v1
kind: Namespace
metadata:
  name: aisre-node-disk-pressure
---
# Enche o disco do nó do kind via hostPath para provocar DiskPressure.
# O tamanho (FILL_MB) deve ser ajustado ao espaço livre do host de teste.
apiVersion: v1
kind: Pod
metadata:
  name: disk-filler
  namespace: aisre-node-disk-pressure
spec:
  restartPolicy: Never
  containers:
    - name: filler
      image: busybox:1.36
      env:
        - {name: FILL_MB, value: "20480"}
      command: ["sh", "-c", "dd if=/dev/zero of=/host/aisre-fill.bin bs=1M count=$FILL_MB; sleep 3600"]
      volumeMounts:
        - {name: host, mountPath: /host}
  volumes:
    - name: host
      hostPath: {path: /var/lib/aisre-fill, type: DirectoryOrCreate}
