apiVersion: v1
kind: Namespace
metadata:
  name: eval-6
---
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: eval-6
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: python:3.12-alpine
      # cresce ~1 MiB por segundo, devagar o bastante para o detector preditivo agir antes do limite
      command: ["python", "-c", "import time\nb=[]\nwhile True:\n    b.append(bytearray(1024*1024)); time.sleep(1)"]
      resources:
        limits:
          memory: 256Mi
