{{- if .Values.kubernetes.enabled }}
# Somente leitura. É exatamente o que a ferramenta `kubernetes` usa: read/list de pods,
# list de nodes e list de events. Sem secrets, sem verbos de escrita, sem curingas.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aisre.fullname" . }}-readonly
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "list", "watch"]
{{- end }}
