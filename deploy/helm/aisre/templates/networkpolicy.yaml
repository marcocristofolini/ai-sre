{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aisre.fullname" . }}
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aisre.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  {{- with .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 8000
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aisre.fullname" . }}-postgres
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aisre.postgres.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aisre.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- end }}
