{{- /* Secret da aplicação: só com secrets.create=true e SOMENTE com as chaves que o usuário informou. */ -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aisre.fullname" . }}-secrets
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $v.adminPasswordHash }}
  admin-password-hash: {{ $v.adminPasswordHash | quote }}
  {{- end }}
  {{- if $v.sessionSecret }}
  session-secret: {{ $v.sessionSecret | quote }}
  {{- end }}
  {{- if $v.llmApiKey }}
  llm-api-key: {{ $v.llmApiKey | quote }}
  {{- end }}
  {{- if $v.slackBotToken }}
  slack-bot-token: {{ $v.slackBotToken | quote }}
  {{- end }}
  {{- if $v.slackSigningSecret }}
  slack-signing-secret: {{ $v.slackSigningSecret | quote }}
  {{- end }}
  {{- if $v.githubToken }}
  github-token: {{ $v.githubToken | quote }}
  {{- end }}
  {{- if $v.webhookToken }}
  webhook-token: {{ $v.webhookToken | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.postgres.external.existingSecret) .Values.postgres.external.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aisre.fullname" . }}-db
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.external.urlKey }}: {{ .Values.postgres.external.url | quote }}
{{- end }}
