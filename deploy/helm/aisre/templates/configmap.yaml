apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aisre.fullname" . }}
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
data:
  AISRE_LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  AISRE_LLM_MODEL: {{ .Values.llm.anthropic.model | quote }}
  {{- else }}
  AISRE_LLM_MODEL: {{ .Values.llm.local.model | quote }}
  AISRE_LLM_BASE_URL: {{ .Values.llm.local.url | quote }}
  {{- end }}
  AISRE_LLM_EXTERNAL_CONSENT: {{ .Values.llm.externalConsent | quote }}
  AISRE_PROMETHEUS_URL: {{ .Values.prometheus.url | quote }}
  AISRE_LOKI_URL: {{ .Values.loki.url | quote }}
  AISRE_SLACK_CHANNEL: {{ .Values.slack.channel | quote }}
  AISRE_SLACK_APPROVERS: {{ .Values.slack.approvers | toJson | quote }}
  AISRE_GITHUB_REPO: {{ .Values.github.repo | quote }}
  AISRE_KUBERNETES_ENABLED: {{ .Values.kubernetes.enabled | quote }}
  AISRE_ADMIN_USER: {{ .Values.auth.adminUser | quote }}
  AISRE_SESSION_COOKIE_SECURE: {{ .Values.auth.cookieSecure | quote }}
  AISRE_SESSION_TTL_SECONDS: {{ .Values.auth.sessionTtlSeconds | quote }}
  AISRE_PREDICT_WORKLOADS: {{ .Values.predict.workloads | toJson | quote }}
  AISRE_WEB_DIST_DIR: "/app/web/dist"
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
