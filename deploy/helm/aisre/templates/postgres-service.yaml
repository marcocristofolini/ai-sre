{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aisre.fullname" . }}-postgres
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "aisre.postgres.selectorLabels" . | nindent 4 }}
{{- end }}
