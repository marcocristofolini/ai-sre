{{- if .Values.kubernetes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aisre.fullname" . }}-readonly
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aisre.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "aisre.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
