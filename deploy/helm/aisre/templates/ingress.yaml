{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aisre.fullname" . }}
  labels:
    {{- include "aisre.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- if .paths }}{{ fail "ingress.hosts[].paths não é mais aceito: use ingress.publicPrefixes, ingress.webhook.enabled e slack.enabled (o webhook não é exposto por padrão)" }}{{ end }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* "/" só EXATO (index.html do dashboard); as demais rotas por prefixo. */}}
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ include "aisre.fullname" $ }}
                port:
                  name: http
          {{- range $.Values.ingress.publicPrefixes }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "aisre.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- if $.Values.slack.enabled }}
          - path: /slack/actions
            pathType: Exact
            backend:
              service:
                name: {{ include "aisre.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- if $.Values.ingress.webhook.enabled }}
          - path: /alerts/webhook
            pathType: Exact
            backend:
              service:
                name: {{ include "aisre.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
