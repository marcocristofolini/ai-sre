<text x="1105" y="600" text-anchor="start" font-size="11" font-weight="normal" fill="#424a53">A página Precisão só lê</text>
<text x="1105" y="616" text-anchor="start" font-size="11" font-weight="normal" fill="#424a53">esse arquivo. Sem ele:</text>
<text x="1105" y="632" text-anchor="start" font-size="11" font-weight="normal" fill="#424a53">“Sem medição ainda”.</text>
<text x="1105" y="656" text-anchor="start" font-size="11" font-weight="normal" fill="#424a53">O placar mede cenários</text>
<text x="1105" y="672" text-anchor="start" font-size="11" font-weight="normal" fill="#424a53">sintéticos, não produção.</text>
