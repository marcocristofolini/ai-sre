<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" width="1280" height="1020" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Arquitetura do AI SRE</title>
<desc id="d">Alerta do Alertmanager entra pelo webhook autenticado, passa por dedupe e fila, é investigado pelo agente (LLM com consentimento e redação, ferramentas somente leitura, memória como contexto não confiável), validado, gravado no Store e entregue no Slack e no dashboard. Ramo preditivo e ramo do harness de avaliação à parte.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect x="0" y="0" width="1280" height="1020" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="24" y="30" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2328">AI SRE: arquitetura da v1 (somente leitura: sugere comandos e registra aprovação; nada é executado)</text>
<rect x="20" y="46" width="880" height="96" rx="10" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="66" text-anchor="start" font-size="12" font-weight="bold" fill="#8250df">Ramo preditivo (src/aisre/predict)</text>
<rect x="40" y="76" width="200" height="54" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="140.0" y="101.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Prometheus</text>
<text x="140.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#424a53">séries por workload (leitura)</text>
<rect x="300" y="76" width="260" height="54" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="430.0" y="101.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Isolation Forest por workload</text>
<text x="430.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#424a53">estado: aprendendo, depois ativo</text>
<rect x="620" y="76" width="260" height="54" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
<text x="750.0" y="101.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Agendador preditivo</text>
<text x="750.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#424a53">ativo e score &gt; limiar: investiga</text>
<path d="M240 103 H298" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M560 103 H618" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="186" width="200" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="140.0" y="214.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Alerta</text>
<text x="140.0" y="231.0" text-anchor="middle" font-size="11.5" fill="#424a53">Alertmanager / Prometheus</text>
<rect x="300" y="186" width="260" height="60" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="430.0" y="206.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">POST /alerts/webhook</text>
<text x="430.0" y="223.5" text-anchor="middle" font-size="11.5" fill="#424a53">Authorization: Bearer token</text>
<text x="430.0" y="238.5" text-anchor="middle" font-size="11.5" fill="#424a53">(sem token configurado: 503)</text>
<rect x="620" y="186" width="260" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="750.0" y="214.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Dedupe + fila de investigação</text>
<text x="750.0" y="231.0" text-anchor="middle" font-size="11.5" fill="#424a53">janela de dedupe, fila limitada</text>
<path d="M240 216 H298" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M560 216 H618" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M750 130 V184" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="760" y="162" text-anchor="start" font-size="11" font-weight="normal" fill="#6639ba">origem: preditivo</text>
<rect x="20" y="282" width="880" height="330" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="34" y="304" text-anchor="start" font-size="12" font-weight="bold" fill="#0969da">Loop do agente (src/aisre/agent, src/aisre/llm, src/aisre/tools)</text>
<path d="M750 246 V280" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="320" width="400" height="140" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="240.0" y="342.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Provedor LLM (local ou externo)</text>
<rect x="58" y="358" width="364" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="240.0" y="375.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Gate de consentimento</text>
<text x="240.0" y="392.5" text-anchor="middle" font-size="11.5" fill="#424a53">externo só com AISRE_LLM_EXTERNAL_CONSENT=true</text>
<rect x="58" y="408" width="364" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="240.0" y="425.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Redação de segredos</text>
<text x="240.0" y="442.5" text-anchor="middle" font-size="11.5" fill="#424a53">em tudo que é enviado ao LLM</text>
<rect x="500" y="320" width="380" height="140" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="690.0" y="342.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Ferramentas somente leitura</text>
<rect x="516" y="358" width="168" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="600.0" y="383.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Kubernetes</text>
<rect x="696" y="358" width="168" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="780.0" y="383.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Prometheus</text>
<rect x="516" y="408" width="168" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="600.0" y="433.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Loki</text>
<rect x="696" y="408" width="168" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="780.0" y="433.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">GitHub</text>
<path d="M442 390 H498" fill="none" stroke="#57606a" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="40" y="486" width="840" height="56" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="460.0" y="512.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Memória de incidentes passados (pgvector, top-k)</text>
<text x="460.0" y="529.0" text-anchor="middle" font-size="11.5" fill="#424a53">contexto NÃO confiável: bloco delimitado e redigido, sem id citável</text>
<path d="M240 486 V462" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="34" y="574" text-anchor="start" font-size="11" font-weight="normal" fill="#424a53">Rótulos de alerta, logs e saídas das ferramentas são dados não confiáveis (delimitados); só resultados das</text>
<text x="34" y="590" text-anchor="start" font-size="11" font-weight="normal" fill="#424a53">ferramentas recebem id opaco (E1, E2, ...) e só esses ids podem ser citados como evidência.</text>
<rect x="40" y="650" width="840" height="62" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="460.0" y="679.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Validação do RCA</text>
<text x="460.0" y="696.0" text-anchor="middle" font-size="11.5" fill="#424a53">só cita ids de evidência consultados; teto de confiança (1 evidência: 0,6); sem evidência suficiente: “não sei”</text>
<path d="M460 612 V648" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="240" y="752" width="440" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="460.0" y="778.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Store: Postgres + pgvector</text>
<text x="460.0" y="795.0" text-anchor="middle" font-size="11.5" fill="#424a53">em memória se AISRE_DATABASE_URL não estiver definido</text>
<path d="M460 712 V750" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="880" width="380" height="96" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="230.0" y="911.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Slack</text>
<text x="230.0" y="928.0" text-anchor="middle" font-size="11.5" fill="#424a53">mensagem com RCA e comando sugerido</text>
<text x="230.0" y="943.0" text-anchor="middle" font-size="11.5" fill="#424a53">botão Aprovar: só registra a aprovação</text>
<text x="230.0" y="958.0" text-anchor="middle" font-size="11.5" fill="#424a53">nada é executado</text>
<rect x="480" y="880" width="400" height="96" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="680.0" y="911.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Dashboard React (login local)</text>
<text x="680.0" y="928.0" text-anchor="middle" font-size="11.5" fill="#424a53">Incidentes · Risco · Precisão · Integrações</text>
<text x="680.0" y="943.0" text-anchor="middle" font-size="11.5" fill="#424a53">aprovação no dashboard também só registra</text>
<text x="680.0" y="958.0" text-anchor="middle" font-size="11.5" fill="#424a53">avisa que o comando vem de um LLM</text>
<path d="M460 808 V844 H230 V878" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M460 844 H680 V878" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="930" y="46" width="330" height="930" rx="10" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="944" y="66" text-anchor="start" font-size="12" font-weight="bold" fill="#57606a">Ramo do harness (make eval)</text>
<rect x="950" y="80" width="290" height="56" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
<text x="1095.0" y="106.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Cluster kind aisre-eval</text>
<text x="1095.0" y="123.0" text-anchor="middle" font-size="11.5" fill="#424a53">só aceita o contexto kind-aisre-eval</text>
<rect x="950" y="176" width="290" height="56" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
<text x="1095.0" y="202.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Falhas injetadas</text>
<text x="1095.0" y="219.0" text-anchor="middle" font-size="11.5" fill="#424a53">harness/manifests: cenários sintéticos</text>
<rect x="950" y="272" width="290" height="56" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
<text x="1095.0" y="290.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Investigação de cada cenário</text>
<text x="1095.0" y="307.5" text-anchor="middle" font-size="11.5" fill="#424a53">mesmo loop do agente</text>
<text x="1095.0" y="322.5" text-anchor="middle" font-size="11.5" fill="#424a53">(agente real só com AISRE_EVAL_AGENT=1)</text>
<rect x="950" y="368" width="290" height="56" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
<text x="1095.0" y="386.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Correção (grading)</text>
<text x="1095.0" y="403.5" text-anchor="middle" font-size="11.5" fill="#424a53">sem a ferramenta necessária:</text>
<text x="1095.0" y="418.5" text-anchor="middle" font-size="11.5" fill="#424a53">“não medível neste ambiente”</text>
<rect x="950" y="464" width="290" height="56" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
<text x="1095.0" y="490.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">eval/scoreboard.json</text>
<text x="1095.0" y="507.0" text-anchor="middle" font-size="11.5" fill="#424a53">gerado por make eval</text>
<path d="M1095.0 136 V174" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M1095.0 232 V270" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
